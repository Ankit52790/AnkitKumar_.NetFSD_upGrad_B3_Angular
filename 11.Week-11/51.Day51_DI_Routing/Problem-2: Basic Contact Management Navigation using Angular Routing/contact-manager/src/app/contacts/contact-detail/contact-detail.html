<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

      <div class="card shadow-lg border-0 rounded-4">

        <!-- Header -->
        <div class="card-header bg-success text-white text-center rounded-top-4">
          <h3 class="mb-0">Contact Details</h3>
        </div>

        <!-- Body -->
        <div class="card-body p-4">

          <!-- IF DATA EXISTS -->
          <div *ngIf="contact; else noData">

            <div class="mb-3">
              <strong>ID:</strong>
              <span class="ms-2">{{ contact.id }}</span>
            </div>

            <div class="mb-3">
              <strong>Name:</strong>
              <span class="ms-2">{{ contact.name }}</span>
            </div>

            <div class="mb-3">
              <strong>Email:</strong>
              <span class="ms-2">{{ contact.email }}</span>
            </div>

            <div class="mb-3">
              <strong>Phone:</strong>
              <span class="ms-2">{{ contact.phone }}</span>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between mt-4">

              <button 
                class="btn btn-primary px-4"
                routerLink="/contacts">
                ⬅ Back
              </button>

              <button 
                class="btn btn-outline-secondary px-4"
                routerLink="/add-contact">
                Add New
              </button>

            </div>

          </div>

          <!-- ELSE BLOCK -->
          <ng-template #noData>
            <div class="text-center">

              <h5 class="text-danger">Contact not found</h5>

              <button 
                class="btn btn-secondary mt-3"
                routerLink="/contacts">
                Go Back
              </button>

            </div>
          </ng-template>

        </div>

      </div>

    </div>

  </div>

</div>

<div class="container mt-4">

  <h2 class="text-center mb-4">Contact List</h2>

  <div class="d-flex justify-content-between mb-3">
    <span class="fw-bold">All Contacts</span>
    <a routerLink="/add-contact" class="btn btn-primary">
      + Add Contact
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">

      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let c of contacts">
            <td>{{ c.id }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td>
              <a [routerLink]="['/contact', c.id]" class="btn btn-sm btn-info text-white">
                View
              </a>
            </td>
          </tr>
        </tbody>

      </table>

    </div>
  </div>

</div>

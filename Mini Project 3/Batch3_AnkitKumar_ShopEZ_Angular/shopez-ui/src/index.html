<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShopEZ</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO -->
  <meta name="description" content="ShopEZ - Modern E-commerce Platform">
  <meta name="keywords" content="ecommerce, shopping, online store">
  <meta name="author" content="ShopEZ Team">

  <link rel="icon" href="favicon.ico">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Global Styles -->
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: #f8f9fa;
    }

    /* Simple loader */
    .page-loader {
      position: fixed;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
  </style>

</head>

<body>

  <!-- Loader -->
  <div id="loader" class="page-loader">
    <div class="spinner-border text-primary"></div>
  </div>

  <!-- Navbar area (Angular will control actual nav component) -->
  <div class="container-fluid bg-dark text-white py-2 text-center">
    <h5 class="m-0">🛒 ShopEZ - Smart Shopping Experience</h5>
  </div>

  <!-- Angular Root -->
  <app-root></app-root>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3 mt-4">
    <small>© 2026 ShopEZ | All Rights Reserved</small>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- jQuery (NOT recommended in Angular, but optional for simple UI effects) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>
    // Hide loader when page loads
    $(window).on("load", function () {
      $("#loader").fadeOut();
    });
  </script>

</body>
</html>
